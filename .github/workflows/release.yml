name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: hidage-linux-amd64
          - goos: linux
            goarch: arm64
            asset: hidage-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: hidage-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: hidage-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: hidage-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: hidage-windows-arm64.exe

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.buildVersion=${{ github.ref_name }}" -o ${{ matrix.asset }} ./cmd/hidage

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum hidage-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Binaries for Linux, macOS and Windows on amd64 and arm64; check them against `SHA256SUMS`.

            **The Windows binaries are untested on real machines.** They are cross-compiled and the unit tests pass on GitHub's Windows runners, but pairing, the firewall prompt, the scheduled task, the password store and a full backup and restore have not been tried on Windows yet. Reports are welcome.
          files: |
            hidage-*
            SHA256SUMS
